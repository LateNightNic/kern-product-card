<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content ="width=device-width, initial-scale=1.0">
    <title>KERN Product Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Poetsen+One&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="card-grid">

        <article class="product-container">
            <div class="product-type">
                <span class ="tag">BESTSELLER</span>
                <p class="category">SERIF — OLD STYLE</p>
            </div>
            <div class="product-preview">
                <div class="product-gardamond">
                    <p>AaBbCc</p>
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-name">EB Garamond</h3> 
                <p class="creator">Designed by Georg Duffner, Octavio Pardo</p>
                <p class="product-price">£199.00</p>
            </div>
            <div class="btn-container">
                <button class="btn-purchase" type="button">Add to Cart</button>
                <button class="btn-preview" type="button">Preview Font</button>
            </div>
        </article>

          <article class="product-container">
            <div class="product-type">
                <span class ="tag">NEW</span>
                <p class="category">ART NOUVEAU</p>
            </div>
            <div class="product-preview">
                <div class="product-aladin">
                    <p>AaBbCc</p>
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-name">Aladin</h3> 
                <p class="creator">Designed by Sudtipos</p>
                <p class="product-price">£159.00</p>
            </div>
            <div class="btn-container">
                <button class="btn-purchase" type="button">Add to Cart</button>
                <button class="btn-preview" type="button">Preview Font</button>
            </div>
        </article>

          <article class="product-container">
            <div class="product-type">
                <span class ="tag">NEW</span>
                <p class="category">SAN SERIF — ROUNDED</p>
            </div>
            <div class="product-preview">
                <div class="product-poetsen-one">
                    <p>AaBbCc</p>
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-name">Poetsen One</h3> 
                <p class="creator">Designed by Rodrigo Fuenzalida, Pablo Impallari</p>
                <p class="product-price">£219.00</p>
            </div>
            <div class="btn-container">
                <button class="btn-purchase" type="button">Add to Cart</button>
                <button class="btn-preview" type="button">Preview Font</button>
            </div>
        </article>

    </section>
</body>

</html>
